name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint all workspaces
        run: pnpm lint

      - name: Type-check frontend
        run: pnpm --filter frontend type-check

      - name: Type-check backend
        run: pnpm --filter backend type-check

      - name: Run unit tests
        run: pnpm --filter frontend test

      - name: Build all workspaces
        run: pnpm build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      cosmosdb:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
          - 10251:10251
          - 10252:10252
          - 10253:10253
          - 10254:10254
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 10
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Wait for CosmosDB emulator
        run: |
          echo "Waiting for CosmosDB emulator certificate..."
          timeout=300
          counter=0
          until curl -sk https://localhost:8081/_explorer/emulator.pem > /dev/null 2>&1; do
            if [ $counter -ge $timeout ]; then
              echo "Timeout waiting for CosmosDB emulator certificate"
              exit 1
            fi
            echo "Waiting for cert... ($counter seconds)"
            sleep 5
            counter=$((counter + 5))
          done
          echo "Certificate available, waiting for database services..."

          # Wait for the database to actually respond to API calls
          counter=0
          until curl -sk https://localhost:8081/ | grep -q "Microsoft Azure Cosmos DB"; do
            if [ $counter -ge 120 ]; then
              echo "Timeout waiting for CosmosDB database services"
              exit 1
            fi
            echo "Waiting for database... ($counter seconds)"
            sleep 5
            counter=$((counter + 5))
          done
          echo "CosmosDB emulator is ready!"

      - name: Seed database
        run: pnpm --filter backend db:seed
        env:
          COSMOS_DB_ENDPOINT: https://localhost:8081
          COSMOS_DB_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          NODE_ENV: development
          COSMOS_DB_ENDPOINT: https://localhost:8081
          COSMOS_DB_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

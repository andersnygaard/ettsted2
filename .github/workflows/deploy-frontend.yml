name: Deploy Frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend files changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'components/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy-frontend.yml'
          base: ${{ github.event.workflow_run.head_sha }}~1
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip if no frontend changes
        if: steps.changes.outputs.frontend != 'true'
        run: echo "No frontend changes, skipping deployment"

      - uses: pnpm/action-setup@v2
        if: steps.changes.outputs.frontend == 'true'
        with:
          version: 8

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm install

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm --filter frontend build
        env:
          VITE_API_URL: https://finans-backend.azurewebsites.net/api/v1
          VITE_APP_ENV: production

      - name: Login to Azure
        if: steps.changes.outputs.frontend == 'true'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        if: steps.changes.outputs.frontend == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: finans-frontend
          package: ./frontend/dist
